[package]
name = "keyrot"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Encrypted secrets vault with versioning, rotation and a tamper-evident audit log"
license = "MIT"
repository = "https://github.com/masterazul/keyrot"
readme = "README.md"
keywords = ["secrets", "vault", "encryption", "rotation", "audit"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "keyrot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"
base64 = "0.23"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
